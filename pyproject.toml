[project]
name = "skala-agent"
version = "0.1.0"
description = "KV cache 기술 비교를 위한 Agentic RAG 협업 뼈대"
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "langgraph>=1.0,<2",
    "numpy>=2.4.6",
    "pydantic>=2.10,<3",
    "pypdf>=6,<7",
    "python-dotenv>=1,<2",
    "tokenizers>=0.20,<1",
]

[project.optional-dependencies]
# bge-m3 실제 임베딩용. 모델 약 2.2GB를 내려받으므로 CI 기본 설치에서는 제외합니다.
embedding = ["FlagEmbedding>=1.3,<2"]

[project.scripts]
skala-agent = "skala_agent.cli:main"
skala-evaluate = "skala_agent.evaluate_cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
